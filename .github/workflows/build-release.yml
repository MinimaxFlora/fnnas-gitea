name: build-and-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "上游 Gitea tag，例如 v28.4.0；留空则自动取上游最新 release"
        required: false
        default: ""
      force:
        description: "已存在同名 Release 时强制重建（会先删除旧 Release 与 tag）"
        type: boolean
        default: false
  schedule:
    # 每天检查一次上游是否有新版本
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  resolve:
    name: 解析上游 tag
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - name: 解析上游最新 tag 并判断是否需要构建
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG}"
          if [ -z "$tag" ]; then
            tag=$(curl -fsSL --retry 3 "https://api.github.com/repos/go-gitea/gitea/releases/latest" \
                  | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -n1)
          fi
          case "$tag" in
            v*) ;;
            *) echo "无法解析 tag: '$tag'" >&2; exit 1 ;;
          esac

          echo "上游 tag: $tag"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$FORCE" != "true" ] && gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            echo "已存在 Release $tag，跳过构建（需要重建请勾选 force）"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: 编译并发布 ${{ needs.resolve.outputs.tag }}
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: 安装 Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22.18.0"

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: false

      - name: 编译并打包两个架构
        run: bash scripts/build.sh --tag "${{ needs.resolve.outputs.tag }}"

      - name: 生成 Release 说明
        run: bash scripts/release-notes.sh --tag "${{ needs.resolve.outputs.tag }}" > dist/RELEASE_NOTES.md

      - name: 校验 fpk 结构
        run: |
          set -euo pipefail
          for f in dist/*.fpk; do
            echo "== $f"
            tar -tzf "$f" | sort
          done
          cat dist/SHA256SUMS

      - name: 保存构建产物
        uses: actions/upload-artifact@v7
        with:
          name: fpk-${{ needs.resolve.outputs.version }}
          path: |
            dist/*.fpk
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md
          if-no-files-found: error

      - name: 创建 GitHub Release（tag 与上游一致）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ "$FORCE" = "true" ] && gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TAG" \
            --notes-file dist/RELEASE_NOTES.md \
            dist/*.fpk dist/SHA256SUMS
